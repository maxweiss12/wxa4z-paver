<style>
  .page-toc { display: none; }

  body.has-page-toc .page-toc {
    display: block !important;
    position: fixed;
    top: 100px;
    right: 0;
    left: auto;
    width: 220px;
    max-height: calc(100vh - 130px);
    overflow-y: auto;
    box-sizing: border-box;
    padding: 16px;
    background: #fff;
    border: 2px solid #000;
    border-right: none;
    border-radius: 6px 0 0 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    z-index: 9999;
    font-size: 12px;
    line-height: 1.5;
  }

  body.has-page-toc .page-toc h2 { margin-top: 0; font-size: 15px; }
  body.has-page-toc .page-toc ul { list-style: none; margin: 0; padding: 0; }
  body.has-page-toc .page-toc li { margin: 8px 0; }
  body.has-page-toc .page-toc .page-toc-subheading { padding-left: 12px; }
  body.has-page-toc .page-toc a { color: #000; text-decoration: none; }
  body.has-page-toc .page-toc a:hover { text-decoration: underline; }

  /* Reserve room on wide screens so content doesn't run under the TOC */
  /* Content fills the space between the sidebar and the TOC */
  @media (min-width: 50rem) {
    .main {
      margin-left: 280px !important;   /* sidebar width */
      max-width: none !important;
    }
    .main-header,
    .main-content-wrap {
      max-width: none !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .main-content-wrap {
      padding-left: 2rem;
      padding-right: 2rem;
    }
  }

  /* Keep text from running under the fixed TOC */
  @media (min-width: 1400px) {
    .main {
      padding-right: 240px;
      box-sizing: border-box;
    }
  }

  /* Too narrow to fit beside the content: hide it */
  @media (max-width: 1399px) {
    body.has-page-toc .page-toc { display: none !important; }
  }
</style>
<script src="{{ '/assets/js/page-toc.js' | relative_url }}" defer></script>
